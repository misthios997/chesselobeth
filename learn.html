<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .loader { font-size: 2rem; color: #ffd700; }
    </style>
</head>
<body>
    <div class="loader"><i class="fas fa-circle-notch fa-spin"></i> Checking Access...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyAkKDbf6qcWvZME8p8wP0gvKKpB8o0RPaw", authDomain: "chesselobeth.firebaseapp.com", projectId: "chesselobeth", storageBucket: "chesselobeth.firebasestorage.app", messagingSenderId: "829508204106", appId: "1:829508204106:web:e8952c359f63d49646d8b3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (u) => {
            if(!u) window.location.href = "index.html";
            
            // CHECK PREMIUM STATUS
            const snap = await getDoc(doc(db, "users", u.displayName));
            const isPremium = snap.exists() && snap.data().isPremium && snap.data().premiumUntil > Date.now();

            if (isPremium) {
                // ALLOW ACCESS (Render Content)
                document.body.innerHTML = `
                    <div style="max-width:600px; padding:20px;">
                        <h1 style="color:#ffd700">Learn Chess</h1>
                        <p>Welcome to Premium Learning Content.</p>
                        <div style="background:#2d2d2d; padding:20px; border-radius:10px; margin-top:20px;">
                            <h3>Lesson 1: The Opening</h3>
                            <p>Control the center...</p>
                        </div>
                        <button onclick="window.location.href='main.html'" style="margin-top:30px; padding:10px 20px; background:#444; border:none; color:white; border-radius:8px; cursor:pointer;">Back to Lobby</button>
                    </div>
                `;
            } else {
                // BLOCK ACCESS
                alert("This feature is for Premium users only.");
                window.location.href = "premium.html";
            }
        });
    </script>
</body>
</html>
