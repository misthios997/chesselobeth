<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Premium Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ffffff;
            --primary: #ffd700;
            --premium: #00d2ff;
            --green: #81b64c;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header { width: 100%; max-width: 500px; margin-bottom: 20px; }
        .btn-back { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        .premium-card {
            background: linear-gradient(145deg, #2d2d2d, #1f1f1f);
            border: 2px solid var(--premium);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
            margin-bottom: 25px;
        }

        .premium-icon { font-size: 4rem; color: var(--premium); margin-bottom: 15px; text-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
        h1 { margin: 10px 0; color: var(--premium); }
        
        .benefits-list { text-align: left; margin: 25px 0; list-style: none; padding: 0; }
        .benefits-list li { padding: 12px 0; border-bottom: 1px solid #444; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .benefits-list li i { color: var(--primary); width: 25px; }

        .ad-section {
            background: #222;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px dashed var(--premium);
        }

        .btn-watch {
            background: var(--premium); color: black; border: none; padding: 18px; width: 100%;
            border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 20px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* UI PURA-PURA VIDEO PLAYER (OVERLAY) */
        #rewardOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        .video-loader {
            width: 80px; height: 80px; border: 5px solid #333; border-top: 5px solid var(--premium);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #timerCircle {
            width: 100px; height: 100px; border-radius: 50%; border: 5px solid var(--green);
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: bold; color: white; margin: 20px 0;
            background: #222;
        }

        .status-text { color: #aaa; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-back" onclick="window.location.href='main.html'">
            <i class="fas fa-arrow-left"></i> Back
        </button>
    </div>

    <div class="premium-card">
        <i class="fas fa-gem premium-icon"></i>
        <h1>Premium Status</h1>
        <p style="color:#aaa">Unlock Learn Mode & Unlimited Bot</p>

        <ul class="benefits-list">
            <li><i class="fas fa-book-open"></i> Access All Learning</li>
            <li><i class="fas fa-robot"></i> Unlimited Play Bot</li>
            <li><i class="fas fa-crown"></i> 💎 Title Badge</li>
        </ul>
    </div>

    <div class="ad-section">
        <h2 style="color:white; margin:0 0 5px 0;">Watch Ad to Unlock</h2>
        <p style="color:#aaa; font-size:0.9rem;">Watch 1 advertisement to get <b>24 Hours Premium</b>.</p>
        
        <button class="btn-watch" onclick="startRewardedAd()">
            <i class="fas fa-play-circle"></i> WATCH VIDEO
        </button>
    </div>

    <div id="rewardOverlay">
        <div id="loaderUI" class="video-loader"></div>
        <div id="timerCircle" style="display:none">15</div>
        <h2 id="adStatus" style="color:white; margin-top:10px;">Loading Ad...</h2>
        <p class="status-text">Please keep this tab open to receive reward.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyAkKDbf6qcWvZME8p8wP0gvKKpB8o0RPaw", authDomain: "chesselobeth.firebaseapp.com", projectId: "chesselobeth", storageBucket: "chesselobeth.firebasestorage.app", messagingSenderId: "829508204106", appId: "1:829508204106:web:e8952c359f63d49646d8b3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // DIRECT LINK MONETAG KAMU
        const DIRECT_LINK = "https://omg10.com/4/10616896"; 
        
        let curName = "";

        onAuthStateChanged(auth, (u) => {
            if(!u) window.location.href = "index.html";
            curName = u.displayName;
        });

        window.startRewardedAd = () => {
            // 1. Tampilkan UI Loading
            const overlay = document.getElementById('rewardOverlay');
            const status = document.getElementById('adStatus');
            const timerDiv = document.getElementById('timerCircle');
            const loader = document.getElementById('loaderUI');
            
            overlay.style.display = 'flex';
            status.innerText = "Opening Ad...";

            // 2. Delay 1.5 detik biar kerasa 'loading', baru buka iklan
            setTimeout(() => {
                window.open(DIRECT_LINK, '_blank');
                
                // 3. Ganti UI jadi Timer Hitung Mundur
                loader.style.display = 'none';
                timerDiv.style.display = 'flex';
                status.innerText = "Verifying View...";
                
                let timeLeft = 15; // Timer 15 detik
                timerDiv.innerText = timeLeft;
                
                const interval = setInterval(() => {
                    timeLeft--;
                    timerDiv.innerText = timeLeft;
                    
                    if(timeLeft <= 0) {
                        clearInterval(interval);
                        finishReward();
                    }
                }, 1000);
                
            }, 1500);
        };

        async function finishReward() {
            const status = document.getElementById('adStatus');
            status.innerText = "Claiming Reward...";
            
            const oneDay = 24 * 60 * 60 * 1000;
            const newExpiry = Date.now() + oneDay;

            try {
                const docRef = doc(db, "users", curName);
                const docSnap = await getDoc(docRef);
                let finalExpiry = newExpiry;

                if (docSnap.exists() && docSnap.data().premiumUntil > Date.now()) {
                    finalExpiry = docSnap.data().premiumUntil + oneDay;
                }

                await setDoc(docRef, {
                    isPremium: true,
                    premiumUntil: finalExpiry
                }, { merge: true });

                alert("SUCCESS! 💎 Premium activated for 24 Hours.");
                window.location.href = "main.html";
            } catch (e) {
                alert("Error saving data: " + e.message);
                document.getElementById('rewardOverlay').style.display = 'none';
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Monetag Ready'))
            .catch(err => console.error('Monetag Error:', err));
        }
    </script>
</body>
</html>
