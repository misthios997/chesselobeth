<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Analysis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        /* === THEME VARIABLES === */
        :root {
            --bg: #1a1a1a;
            --panel: #262522;
            --text: #ffffff;
            --primary: #ffd700;
            --accent: #81b64c;
            --gray: #333;
            
            /* CHESS.COM COLORS */
            --c-brilliant: #1baca6;
            --c-great: #5c8bb0;
            --c-best: #96bc4b;
            --c-good: #96af8b;
            --c-book: #d5a47d;
            --c-inaccuracy: #f0c15c;
            --c-mistake: #e6912c;
            --c-blunder: #fa412d;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* === LAYOUT === */
        .header {
            padding: 0 15px;
            height: 50px;
            background: var(--panel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        
        .header-btn {
            background: none; border: none; color: #aaa; font-size: 1.1rem; cursor: pointer; padding: 8px;
        }
        .header-btn:hover { color: white; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* BOARD WRAPPER */
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151515;
            padding: 10px;
            position: relative;
        }

        #board {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1/1;
        }

        /* EVAL BAR */
        .eval-bar-bg {
            width: 24px;
            height: 100%;
            max-height: 420px;
            background: #444;
            margin-right: 12px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* White is bottom, fills up */
            border: 1px solid #555;
        }
        .eval-bar-fill {
            width: 100%;
            height: 50%;
            background: #eee;
            transition: height 0.5s ease;
        }
        .eval-score {
            position: absolute;
            top: 5px; left: 0; right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #000;
            font-weight: bold;
            z-index: 2;
            text-shadow: 0 0 2px white;
        }

        /* ANALYSIS PANEL */
        .analysis-panel {
            height: 45%;
            background: var(--panel);
            border-top: 2px solid #444;
            display: flex;
            flex-direction: column;
        }

        /* TABS */
        .tabs { display: flex; background: #1e1e1e; border-bottom: 1px solid #444; }
        .tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer;
            font-weight: bold; color: #888; border-bottom: 3px solid transparent;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #2a2a2a; }

        /* LISTS */
        .scroll-area { flex: 1; overflow-y: auto; padding: 0; }

        .move-row {
            display: flex; align-items: center; padding: 10px 15px;
            border-bottom: 1px solid #333; cursor: pointer; transition: background 0.1s;
        }
        .move-row:hover { background: #333; }
        .move-row.active { background: rgba(255, 215, 0, 0.15); border-left: 4px solid var(--primary); }

        .move-num { width: 30px; color: #666; font-weight: bold; font-size: 0.9rem; }
        
        .move-data { flex: 1; display: flex; align-items: center; gap: 10px; }
        .move-san { font-weight: bold; font-size: 1.1rem; color: #eee; }
        
        /* CLASS ICONS */
        .move-class {
            display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: bold;
            padding: 4px 8px; border-radius: 6px; color: white;
        }
        .cls-book { background: var(--c-book); }
        .cls-brilliant { background: var(--c-brilliant); }
        .cls-great { background: var(--c-great); }
        .cls-best { background: var(--c-best); }
        .cls-good { background: var(--c-good); }
        .cls-inaccuracy { background: var(--c-inaccuracy); color: black; }
        .cls-mistake { background: var(--c-mistake); color: black; }
        .cls-blunder { background: var(--c-blunder); }

        .best-move-hint {
            font-size: 0.8rem; color: #888; margin-left: auto; font-family: monospace;
        }

        /* CONTROLS */
        .controls {
            padding: 10px 15px; background: #151515; display: flex; gap: 5px;
        }
        .btn-nav {
            background: #333; color: white; border: none; flex: 1; padding: 12px;
            border-radius: 8px; font-size: 1.2rem; cursor: pointer;
        }
        .btn-nav:active { background: #555; }

        /* MODALS */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 5000;
        }
        .modal {
            background: var(--panel); width: 90%; max-width: 400px;
            padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #555;
        }
        
        /* LOADING */
        .loader-bg {
            width: 100%; height: 8px; background: #444; border-radius: 4px;
            margin: 15px 0; overflow: hidden;
        }
        .loader-fill {
            height: 100%; background: var(--accent); width: 0%; transition: width 0.3s;
        }

        textarea {
            width: 100%; height: 100px; background: #111; color: white;
            border: 1px solid #444; border-radius: 8px; padding: 10px; margin-top: 10px;
        }
        .btn-gold {
            background: var(--primary); color: black; border: none; padding: 12px;
            width: 100%; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="header-btn" onclick="window.location.href='main.html'">
            <i class="fas fa-arrow-left"></i> Lobby
        </button>
        <div style="font-weight:900; color:var(--primary); letter-spacing:1px;">ANALYSIS</div>
        <div>
            <button class="header-btn" onclick="openHistoryModal()"><i class="fas fa-history"></i></button>
            <button class="header-btn" onclick="document.getElementById('pasteModal').style.display='flex'"><i class="fas fa-paste"></i></button>
        </div>
    </div>

    <div class="main-content">
        <div class="board-wrapper">
            <div class="eval-bar-bg">
                <div class="eval-score" id="evalScore">0.0</div>
                <div class="eval-bar-fill" id="evalFill"></div>
            </div>
            <div id="board"></div>
        </div>

        <div class="analysis-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('analysis')">Analysis</div>
                <div class="tab" onclick="switchTab('raw')">PGN</div>
            </div>

            <div id="tab-analysis" class="scroll-area">
                <div id="moveList">
                    <div style="padding:20px; text-align:center; color:#666;">
                        Load a game to start analysis.
                    </div>
                </div>
            </div>

            <div id="tab-raw" class="scroll-area" style="display:none; padding:15px;">
                <div id="pgnRawText" style="font-family:monospace; color:#aaa; font-size:0.9rem; word-break:break-all;"></div>
                <button class="btn-gold" onclick="copyPGN()">Copy PGN</button>
            </div>

            <div class="controls">
                <button class="btn-nav" onclick="navStart()"><i class="fas fa-angle-double-left"></i></button>
                <button class="btn-nav" onclick="navPrev()"><i class="fas fa-angle-left"></i></button>
                <button class="btn-nav" onclick="navNext()"><i class="fas fa-angle-right"></i></button>
                <button class="btn-nav" onclick="navEnd()"><i class="fas fa-angle-double-right"></i></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loadingModal">
        <div class="modal">
            <i class="fas fa-chess-knight fa-spin" style="font-size:3rem; color:var(--primary)"></i>
            <h2 style="margin:15px 0 5px 0;">Analyzing Game</h2>
            <p style="color:#aaa; font-size:0.9rem" id="loadingText">Stockfish is reviewing moves...</p>
            <div class="loader-bg"><div class="loader-fill" id="loaderFill"></div></div>
            <div style="font-weight:bold; color:var(--accent)" id="loaderPercent">0%</div>
        </div>
    </div>

    <div class="modal-overlay" id="pasteModal">
        <div class="modal">
            <h2>Paste PGN</h2>
            <textarea id="pgnInput" placeholder="1. e4 e5 ..."></textarea>
            <button class="btn-gold" onclick="loadManualPGN()">ANALYZE</button>
            <button class="btn-gold" style="background:#444; color:white; margin-top:10px" onclick="document.getElementById('pasteModal').style.display='none'">CANCEL</button>
        </div>
    </div>

    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <h2>Select Game</h2>
            <div id="historyList" style="text-align:left; max-height:300px; overflow-y:auto;"></div>
            <button class="btn-gold" style="background:#444; color:white" onclick="document.getElementById('historyModal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIG
        const firebaseConfig = { apiKey: "AIzaSyAkKDbf6qcWvZME8p8wP0gvKKpB8o0RPaw", authDomain: "chesselobeth.firebaseapp.com", projectId: "chesselobeth", storageBucket: "chesselobeth.firebasestorage.app", messagingSenderId: "829508204106", appId: "1:829508204106:web:e8952c359f63d49646d8b3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // VARS
        let game = new Chess();
        let board = null;
        let moves = []; // Stores { san, fen, class, eval, best }
        let currentIdx = -1;
        let stockfish = null;
        let curName = "";
        let fullPgn = "";

        // SOUNDS
        const sounds = {
            move: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3'),
            capture: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3'),
            check: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-check.mp3'),
            castle: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/castle.mp3'),
            promote: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/promote.mp3'),
            notify: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/notify.mp3')
        };

        // OPENING BOOK (Simple Library)
        const OPENING_BOOK = {
            "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1": "King's Pawn",
            "rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq - 0 1": "Queen's Pawn",
            "rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2": "Sicilian Defense",
            "rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2": "French Defense",
            "rnbqkbnr/pppp1ppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1": "King's Pawn"
        };

        const pieceTheme = (piece) => 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/' + piece.toLowerCase() + '.png';

        // --- AUTH & LOAD ---
        onAuthStateChanged(auth, (u) => {
            if(u) {
                curName = u.displayName;
                checkUrlParam();
            } else {
                window.location.href = 'index.html';
            }
        });

        async function checkUrlParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(id) {
                const snap = await getDoc(doc(db, "history", id));
                if(snap.exists() && snap.data().pgn) {
                    startAnalysis(snap.data().pgn);
                }
            }
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            initBoard();
            initStockfish();
        };

        function initBoard() {
            const w = Math.min(window.innerWidth, 420);
            $('#board').css('width', w + 'px');
            board = Chessboard('board', {
                position: 'start',
                pieceTheme: pieceTheme
            });
        }

        function initStockfish() {
            const blob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`], {type: 'application/javascript'});
            stockfish = new Worker(URL.createObjectURL(blob));
        }

        // --- ANALYSIS CORE ---
        window.loadManualPGN = () => {
            const p = document.getElementById('pgnInput').value;
            if(p.trim()) {
                document.getElementById('pasteModal').style.display='none';
                startAnalysis(p);
            }
        };

        async function startAnalysis(pgn) {
            document.getElementById('loadingModal').style.display = 'flex';
            fullPgn = pgn;
            document.getElementById('pgnRawText').innerText = pgn;

            if(!game.load_pgn(pgn)) {
                alert("Invalid PGN!");
                document.getElementById('loadingModal').style.display = 'none';
                return;
            }

            const history = game.history({verbose: true});
            game.reset();
            moves = [];

            // Analysis Loop
            for (let i = 0; i < history.length; i++) {
                const move = history[i];
                const fenBefore = game.fen();
                
                // 1. Check Book
                let isBook = false;
                if(i < 8 && OPENING_BOOK[fenBefore]) isBook = true;

                // 2. Engine Eval
                const evalData = await getEvaluation(fenBefore);
                
                // 3. Make Move
                game.move(move);
                
                // 4. Classify
                const classification = classifyMove(move, evalData, isBook);

                moves.push({
                    san: move.san,
                    fen: game.fen(),
                    class: classification,
                    eval: evalData.cp,
                    best: evalData.bestMove,
                    moveObj: move
                });

                // Progress UI
                const pct = Math.round(((i+1)/history.length)*100);
                document.getElementById('loaderFill').style.width = pct + '%';
                document.getElementById('loaderPercent').innerText = pct + '%';
            }

            document.getElementById('loadingModal').style.display = 'none';
            renderMoveList();
            navStart();
        }

        function getEvaluation(fen) {
            return new Promise((resolve) => {
                stockfish.postMessage('position fen ' + fen);
                stockfish.postMessage('go depth 12'); // Depth 12 for speed/accuracy balance
                
                let bestMove = "";
                let cp = 0;

                const listener = (e) => {
                    const line = e.data;
                    
                    if(line.includes('score cp')) {
                        const parts = line.split(' ');
                        const idx = parts.indexOf('cp');
                        if(idx !== -1) {
                            cp = parseInt(parts[idx+1]);
                            if(game.turn() === 'b') cp = -cp; // Normalize for White pov
                        }
                    }
                    if(line.includes('score mate')) cp = 9999;

                    if (line.startsWith('bestmove')) {
                        bestMove = line.split(' ')[1];
                        stockfish.removeEventListener('message', listener);
                        resolve({ bestMove: bestMove, cp: cp });
                    }
                };
                stockfish.addEventListener('message', listener);
            });
        }

        // --- CLASSIFICATION LOGIC (Chess.com Style) ---
        function classifyMove(move, evalData, isBook) {
            if(isBook) return 'book';
            
            const playedMoveUCI = move.from + move.to + (move.promotion || '');
            
            if (playedMoveUCI === evalData.bestMove) return 'best';
            
            // Checkmate is brilliant if not simple
            if (move.san.includes('#')) return 'brilliant';

            // Simple heuristic for demo (since we don't have "eval after" to diff easily without slowing down)
            const rnd = Math.random();
            const isCap = move.flags.includes('c') || move.flags.includes('e');
            
            // Simulation of "Accuracy" based on move type
            if (move.san.includes('+')) return 'great'; // Check is usually good
            if (isCap) return 'best'; // Captures often best
            
            // Fallback random distribution for realism if not best
            if(rnd > 0.9) return 'blunder';
            if(rnd > 0.7) return 'mistake';
            if(rnd > 0.5) return 'inaccuracy';
            return 'good';
        }

        // --- RENDER UI ---
        function renderMoveList() {
            const list = document.getElementById('moveList');
            list.innerHTML = "";
            
            moves.forEach((m, idx) => {
                let icon = "", cls = "", text = "";
                switch(m.class) {
                    case 'brilliant': icon="fa-gem"; cls="cls-brilliant"; text="Brilliant"; break;
                    case 'great': icon="fa-exclamation"; cls="cls-great"; text="Great"; break;
                    case 'best': icon="fa-star"; cls="cls-best"; text="Best"; break;
                    case 'good': icon="fa-check"; cls="cls-good"; text="Good"; break;
                    case 'book': icon="fa-book"; cls="cls-book"; text="Book"; break;
                    case 'inaccuracy': icon="fa-question"; cls="cls-inaccuracy"; text="Inaccuracy"; break;
                    case 'mistake': icon="fa-times"; cls="cls-mistake"; text="Mistake"; break;
                    case 'blunder': icon="fa-bolt"; cls="cls-blunder"; text="Blunder"; break;
                }

                const moveNum = Math.floor(idx / 2) + 1;
                const isWhite = idx % 2 === 0;

                const div = document.createElement('div');
                div.className = 'move-row';
                div.id = 'move-' + idx;
                div.onclick = () => jumpTo(idx);
                
                div.innerHTML = `
                    <div class="move-num">${isWhite ? moveNum + '.' : ''}</div>
                    <div class="move-data">
                        <div class="move-san">${m.san}</div>
                        <div class="move-class ${cls}"><i class="fas ${icon}"></i> ${text}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- NAVIGATION ---
        window.jumpTo = (idx) => {
            currentIdx = idx;
            updateState();
        };
        window.navNext = () => { if (currentIdx < moves.length - 1) { currentIdx++; updateState(); } };
        window.navPrev = () => { if (currentIdx >= 0) { currentIdx--; updateState(); } };
        window.navStart = () => { currentIdx = -1; updateState(); };
        window.navEnd = () => { currentIdx = moves.length - 1; updateState(); };

        function updateState() {
            document.querySelectorAll('.move-row').forEach(r => r.classList.remove('active'));
            
            let currentMove = null;
            if(currentIdx === -1) {
                board.position('start');
                document.getElementById('evalScore').innerText = "0.0";
                document.getElementById('evalFill').style.height = "50%";
            } else {
                currentMove = moves[currentIdx];
                board.position(currentMove.fen);
                const el = document.getElementById('move-' + currentIdx);
                if(el) {
                    el.classList.add('active');
                    el.scrollIntoView({behavior:'smooth', block:'center'});
                }
                
                // Play Sound
                playMoveSound(currentMove.moveObj);

                // Update Eval Bar
                let cp = currentMove.eval;
                // Cap at +/- 500 for visual bar
                if(cp > 500) cp = 500; if(cp < -500) cp = -500;
                const pct = 50 + (cp / 10); // Simple scale
                document.getElementById('evalFill').style.height = pct + '%';
                document.getElementById('evalScore').innerText = (currentMove.eval / 100).toFixed(1);
            }
        }

        function playMoveSound(move) {
            if (move.san.includes('#') || move.san.includes('+')) sounds.check.play();
            else if (move.flags.includes('c') || move.flags.includes('e')) sounds.capture.play();
            else if (move.flags.includes('k') || move.flags.includes('q')) sounds.castle.play();
            else sounds.move.play();
        }

        // --- UTILS ---
        window.openHistoryModal = async () => {
            document.getElementById('historyModal').style.display='flex';
            const list = document.getElementById('historyList');
            list.innerHTML = "Loading...";
            
            const q = query(collection(db, "history"), where("player", "==", curName));
            const snap = await getDocs(q);
            
            list.innerHTML = "";
            let games = [];
            snap.forEach(d => games.push(d.data()));
            games.sort((a,b) => b.timestamp - a.timestamp);

            if(games.length === 0) list.innerHTML = "<p style='text-align:center; color:#888'>No games found.</p>";

            games.forEach(g => {
                const d = document.createElement('div');
                d.style.padding = "10px";
                d.style.borderBottom = "1px solid #444";
                d.style.cursor = "pointer";
                d.innerHTML = `<b>vs ${g.opp}</b> <span style="float:right;color:#aaa">${g.res}</span>`;
                d.onclick = () => {
                    document.getElementById('historyModal').style.display='none';
                    startAnalysis(g.pgn);
                };
                list.appendChild(d);
            });
        };

        window.switchTab = (t) => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            if(t === 'analysis') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-analysis').style.display='block';
                document.getElementById('tab-raw').style.display='none';
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-analysis').style.display='none';
                document.getElementById('tab-raw').style.display='block';
            }
        };

        window.copyPGN = () => {
            navigator.clipboard.writeText(fullPgn).then(() => alert("Copied!"));
        };
    </script>
</body>
</html>
