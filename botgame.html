<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playing Bot</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #262626;
            --text: #ffffff;
            --primary: #ffd700;
            --accent: #81b64c;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* CARD PLAYER */
        .player-card {
            background: var(--card);
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid transparent;
        }
        .player-card.top { border-left-color: var(--primary); }
        .player-card.bot { border-left-color: var(--accent); margin-top: 5px; }

        .ava {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #444;
        }
        .ava-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: 2px solid var(--primary);
        }

        .info h3 { margin: 0; font-size: 1rem; }
        .info p { margin: 0; font-size: 0.8rem; color: #888; }

        /* PAPAN CATUR */
        .board-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        #board {
            width: 100%;
            max-width: 450px;
        }

        .status-bar {
            text-align: center;
            color: #aaa;
            font-style: italic;
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* CONTROLS */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .btn-y { background: var(--primary); color: black; }
    </style>
</head>
<body>

<div class="game-container">
    
    <div class="player-card top">
        <div id="botAvaCont"></div>
        <div class="info">
            <h3 id="botName">Bot</h3>
            <p id="botElo">...</p>
        </div>
    </div>

    <div class="status-bar" id="status">Ready</div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="player-card bot">
        <img src="https://ui-avatars.com/api/?name=You&background=random" class="ava" id="myAva">
        <div class="info">
            <h3>You</h3>
            <p>Playing vs AI</p>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-y" onclick="location.href='main.html'"><i class="fas fa-home"></i></button>
        <button class="btn" onclick="undoMove()"><i class="fas fa-undo"></i> Undo</button>
        <button class="btn" onclick="resetGame()"><i class="fas fa-sync"></i> New</button>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
$(document).ready(function() {
    // 1. AMBIL PARAMETER URL
    const params = new URLSearchParams(window.location.search);
    const botId = params.get('bot') || 'pieter';
    const botElo = params.get('elo') || '1250';

    // 2. CONFIG BOT
    const BOTS = {
        'pieter': { n:'Pieter', i:'https://i.ibb.co.com/Wv34J1qd/1771424229420.png', d: 1, s: 0 },
        'maria': { n:'Maria', i:'https://i.ibb.co.com/WvqDx4nn/1771422684683.png', d: 4, s: 5 },
        'hikaru': { n:'Hikaru', i:'https://i.ibb.co.com/HvvdN1n/1771421778737.png', d: 8, s: 10 },
        'magnus': { n:'Magnus', i:'https://i.ibb.co.com/Q3DM9Vhr/1771421721788.png', d: 12, s: 20 },
        'engine': { n:'Engine', icon:'💿', d: 15, s: 20 }
    };
    const bot = BOTS[botId] || BOTS['pieter'];

    // 3. SET UI
    $('#botName').text(bot.n);
    $('#botElo').text('Rating: ' + botElo);
    const avC = $('#botAvaCont');
    if(bot.icon) avC.html(`<div class="ava-icon">${bot.icon}</div>`);
    else avC.html(`<img src="${bot.i}" class="ava" onerror="this.src='https://ui-avatars.com/api/?name=${bot.n}'">`);

    // 4. LOGIC CATUR & ENGINE
    var board = null;
    var game = new Chess();
    var stockfish;

    // FIX: BYPASS CORS BLOCK UNTUK WEB WORKER
    try {
        var blob = new Blob([
            "importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');"
        ], { type: 'application/javascript' });
        var workerUrl = URL.createObjectURL(blob);
        stockfish = new Worker(workerUrl);

        stockfish.postMessage('uci');
        stockfish.postMessage(`setoption name Skill Level value ${bot.s}`);

        stockfish.onmessage = function(e) {
            if(e.data.startsWith('bestmove')) {
                const best = e.data.split(' ')[1];
                if(best) {
                    game.move({ from: best.substring(0,2), to: best.substring(2,4), promotion: 'q' });
                    board.position(game.fen());
                    updateStatus();
                }
            }
        };
    } catch(err) {
        console.error("Engine Error:", err);
        $('#status').text("Error: Engine failed to load");
    }

    function onDragStart(source, piece) {
        if (game.game_over()) return false;
        if (piece.search(/^b/) !== -1) return false; // Cuma boleh gerakin putih
    }

    function onDrop(source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        
        updateStatus();
        window.setTimeout(makeBotMove, 500);
    }

    function onSnapEnd() { board.position(game.fen()); }

    function makeBotMove() {
        if (game.game_over() || !stockfish) return;
        $('#status').text(bot.n + ' is thinking...');
        stockfish.postMessage('position fen ' + game.fen());
        stockfish.postMessage(`go depth ${bot.d}`);
    }

    function updateStatus() {
        var status = 'Your turn';
        if (game.in_checkmate()) status = 'Game Over: You ' + (game.turn() === 'w' ? 'Lost' : 'Won');
        else if (game.in_draw()) status = 'Game Over: Draw';
        else if (game.in_check()) status = 'Check!';
        $('#status').text(status);
    }

    window.undoMove = () => { game.undo(); game.undo(); board.position(game.fen()); updateStatus(); };
    window.resetGame = () => { game.reset(); board.start(); updateStatus(); };

    // 5. INISIALISASI PAPAN (ASET NEO)
    var config = {
        draggable: true,
        position: 'start',
        // Function toLowerCase() wajib buat baca file gambar Neo dari Chess.com
        pieceTheme: function(piece) {
            return 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/' + piece.toLowerCase() + '.png';
        },
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    };

    board = Chessboard('board', config);
    
    // Bikin responsif
    $(window).resize(board.resize);
});
</script>
</body>
</html>
