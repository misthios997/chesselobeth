<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHESSELOBETH - Bot Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --primary: #ffd700; --bg: #1a1a1a; --panel: #2d2d2d; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .game-wrapper { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 8px; padding: 10px 0; }
        .player-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 15px; background: var(--panel); border-radius: 8px; border: 1px solid #333; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 6px; background: #333; object-fit: cover; border: 2px solid var(--primary); }
        .username { font-weight: bold; font-size: 0.95rem; }
        #board { width: 100%; aspect-ratio: 1/1; }
        .controls { display: flex; gap: 10px; padding: 0 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: var(--primary); color: black; }
        .btn-exit { background: #ff4d4d; color: white; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="player-bar"><div class="user-info"><img src="https://i.ibb.co.com/8LpY5v7/avatar1.jpg" class="avatar"><div class="username" id="botName">Stockfish (Lvl 1)</div></div></div>
        <div id="board"></div>
        <div class="player-bar"><div class="user-info"><img src="https://i.ibb.co.com/8LpY5v7/avatar1.jpg" class="avatar" id="myAva"><div class="username" id="myName">You</div></div></div>
        <div class="controls"><button class="btn btn-exit" onclick="window.location.href='main.html'">EXIT</button><button class="btn" onclick="undoMove()">UNDO</button></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyAkKDbf6qcWvZME8p8wP0gvKKpB8o0RPaw", authDomain: "chesselobeth.firebaseapp.com", projectId: "chesselobeth", storageBucket: "chesselobeth.firebasestorage.app", messagingSenderId: "829508204106", appId: "1:829508204106:web:e8952c359f63d49646d8b3" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lvl = new URLSearchParams(window.location.search).get('lvl') || 1;
        document.getElementById('botName').innerText = `Stockfish (Lvl ${lvl})`;

        let game = new Chess(), board;
        
        // NEO THEME
        const pieceTheme = (piece) => 'https://www.chess.com/chess-themes/pieces/neo/300/' + piece.toLowerCase() + '.png';

        const blob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`], {type: 'application/javascript'});
        const stockfish = new Worker(URL.createObjectURL(blob));

        onAuthStateChanged(auth, (u) => {
            if(!u) window.location.href = "index.html";
            document.getElementById('myName').innerText = u.displayName;
            document.getElementById('myAva').src = u.photoURL || "https://i.ibb.co.com/8LpY5v7/avatar1.jpg";
            initGame();
        });

        function initGame() {
            board = Chessboard('board', {
                draggable: true, position: 'start', pieceTheme: pieceTheme,
                onDragStart: (s, p) => !game.game_over() && game.turn() === 'w' && p.charAt(0) === 'w',
                onDrop: (source, target) => {
                    const move = game.move({ from: source, to: target, promotion: 'q' });
                    if (!move) return 'snapback';
                    board.position(game.fen());
                    makeBotMove();
                }
            });
        }

        function makeBotMove() {
            if(game.game_over()) return;
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth ' + lvl);
        }

        stockfish.onmessage = function(event) {
            if (event.data.startsWith('bestmove')) {
                const move = event.data.split(' ')[1];
                game.move(move, { sloppy: true });
                board.position(game.fen());
            }
        };

        window.undoMove = () => { game.undo(); game.undo(); board.position(game.fen()); };
    </script>
</body>
</html>
