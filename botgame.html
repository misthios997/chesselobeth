<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playing Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .game-area { width: 100%; max-width: 450px; padding: 20px; }
        .player-info { display: flex; align-items: center; margin-bottom: 15px; background: #2d2d2d; padding: 10px; border-radius: 12px; }
        /* AVATAR FIX BULAT */
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ffd700; margin-right: 15px; object-fit: cover; }
        .avatar-icon { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ffd700; margin-right: 15px; display: flex; justify-content: center; align-items: center; font-size: 25px; background: #333; }
        .name { font-weight: bold; font-size: 1.1rem; }
        .elo { color: #888; font-size: 0.9rem; }
        #board { width: 100%; margin: 10px 0; touch-action: none; }
        .controls { display: flex; gap: 10px; width: 100%; max-width: 450px; justify-content: center; margin-top: 20px; }
        .btn { background: #333; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-home { background: #ffd700; color: black; }
        .status { margin-top: 10px; color: #aaa; font-style: italic; }
    </style>
</head>
<body>

    <div class="game-area">
        <div class="player-info">
            <div id="botAvatarCont"></div>
            <div>
                <div class="name" id="botName">Loading...</div>
                <div class="elo" id="botElo"></div>
            </div>
        </div>

        <div id="board"></div>

        <div class="player-info" style="margin-top: 15px;">
            <img src="https://i.ibb.co.com/8LpY5v7/avatar1.jpg" class="avatar">
            <div>
                <div class="name">You</div>
            </div>
        </div>
        
        <div class="status" id="status">White to move</div>

        <div class="controls">
            <button class="btn btn-home" onclick="location.href='main.html'"><i class="fas fa-home"></i> Home</button>
            <button class="btn" onclick="undoMove()"><i class="fas fa-undo"></i> Undo</button>
            <button class="btn" onclick="resetGame()"><i class="fas fa-sync"></i> New Game</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const botId = urlParams.get('bot') || 'pieter';
            const botElo = urlParams.get('elo') || '1250';
            
            // CONFIG BOT
            const BOTS_DB = {
                'pieter': { n:'Pieter', i:'https://i.ibb.co.com/Wv34J1qd/1771424229420.png', depth: 2, skill: 1 },
                'maria': { n:'Maria', i:'https://i.ibb.co.com/WvqDx4nn/1771422684683.png', depth: 5, skill: 5 },
                'hikaru': { n:'Hikaru', i:'https://i.ibb.co.com/HvvdN1n/1771421778737.png', depth: 12, skill: 15 },
                'magnus': { n:'Magnus', i:'https://i.ibb.co.com/Q3DM9Vhr/1771421721788.png', depth: 16, skill: 20 },
                'engine': { n:'Engine', icon:'💿', depth: 20, skill: 20 }
            };

            const currentBot = BOTS_DB[botId] || BOTS_DB['pieter'];

            // SETUP UI
            $('#botName').text(currentBot.n);
            $('#botElo').text(`Rating: ${botElo}`);
            
            const avaCont = document.getElementById('botAvatarCont');
            if(currentBot.icon) {
                avaCont.innerHTML = `<div class="avatar-icon">${currentBot.icon}</div>`;
            } else {
                avaCont.innerHTML = `<img src="${currentBot.i}" class="avatar">`;
            }

            // CHESS LOGIC
            var board = null;
            var game = new Chess();
            
            // ENGINE WORKER
            var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');
            stockfish.postMessage('uci');
            stockfish.postMessage(`setoption name Skill Level value ${currentBot.skill}`);

            function onDragStart (source, piece) {
                if (game.game_over()) return false;
                if (piece.search(/^b/) !== -1) return false; // User White
            }

            function onDrop (source, target) {
                var move = game.move({
                    from: source,
                    to: target,
                    promotion: 'q'
                });

                if (move === null) return 'snapback';

                updateStatus();
                window.setTimeout(makeBotMove, 250);
            }

            function onSnapEnd () {
                board.position(game.fen());
            }

            function makeBotMove() {
                if (game.game_over()) return;
                stockfish.postMessage('position fen ' + game.fen());
                stockfish.postMessage(`go depth ${currentBot.depth}`);
            }

            stockfish.onmessage = function(event) {
                if(event.data.startsWith('bestmove')) {
                    const bestMove = event.data.split(' ')[1];
                    game.move({
                        from: bestMove.substring(0, 2),
                        to: bestMove.substring(2, 4),
                        promotion: bestMove.length > 4 ? bestMove.substring(4, 5) : 'q'
                    });
                    board.position(game.fen());
                    updateStatus();
                }
            };

            function updateStatus() {
                var status = '';
                var moveColor = 'White';
                if (game.turn() === 'b') moveColor = 'Black';

                if (game.in_checkmate()) {
                    status = 'Game over, ' + moveColor + ' is in checkmate.';
                } else if (game.in_draw()) {
                    status = 'Game over, drawn position';
                } else {
                    status = moveColor + ' to move';
                    if (game.in_check()) status += ', ' + moveColor + ' is in check';
                }
                $('#status').text(status);
            }

            window.undoMove = function() {
                game.undo(); game.undo();
                board.position(game.fen());
                updateStatus();
            };

            window.resetGame = function() {
                game.reset();
                board.start();
                updateStatus();
            };

            var config = {
                draggable: true,
                position: 'start',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            
            // INIT BOARD
            board = Chessboard('board', config);
            $(window).resize(board.resize);
        });
    </script>
</body>
</html>
